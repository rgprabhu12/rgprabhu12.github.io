<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

<head>
  {% include analytics.html %}
  <title>{{ site.title }} - {{ page.title }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <!--[if lte IE 8]><script src="{{ '/assets/js/ie/html5shiv.js' | relative_url }}"></script><![endif]-->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
  <!--[if lte IE 9]><link rel="stylesheet" href="{{ '/assets/css/ie9.css' | relative_url }}" /><![endif]-->
  <!--[if lte IE 8]><link rel="stylesheet" href="{{ '/assets/css/ie8.css' | relative_url }}" /><![endif]-->
</head>

<body>
  <!-- Wrapper -->
  <div id="wrapper">
    {% include header.html %}
    {% include footer.html %}
    <!-- Main -->
    <div id="main">
      <div class="home" ; style="width: 100%;">
        <h1> Categories </h1>
        <div style="width: 80%; padding-left: 3em;">
          {{ content }}
          <h3>Personal</h3>
          <ul>
          {% for post in site.categories.Personal%}
            <li>
              <article class="archive-item">
                <h4><a href="{{ site.baseurl }}{{ post.url }}">{{post.title}}</a></h4>
                <span class="post-meta">{{ post.date | date: date_format }}</span>
                <br>
              </article>
            </li>
          {% endfor %}
          </ul>

      </div>
    </div>

    <script src="{{ '/assets/js/jquery.min.js' | relative_url }}"></script>

    <!--[if lte IE 8]><script src="{{ '/assets/js/ie/respond.min.js' | relative_url }}"></script><![endif]-->
